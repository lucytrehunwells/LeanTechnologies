<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lean Industry × Use Case × Product Grid</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;--bg2:#F4F5F7;--bg3:#ECEDF1;
  --border:#E3E4EA;--border2:#CACBD5;
  --text:#1C2024;--text2:#60646C;--text3:#B9BBC6;
  --green:#299764;--green-l:#EDF7F2;--green-d:#1F7A4E;--green-b:rgba(41,151,100,0.18);
  --purple:#5b4fcf;--purple-l:#eeecfb;--purple-b:rgba(91,79,207,0.18);
  --coral:#C62A2F;--coral-l:#FDF0F0;--coral-b:rgba(198,42,47,0.18);
  --blue:#256E93;--blue-l:#EDF4F8;--blue-b:rgba(37,110,147,0.18);
  --amber:#915930;--amber-l:#FBF6F1;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.03);
  --shadow-md:0 4px 12px rgba(0,0,0,.07),0 2px 4px rgba(0,0,0,.03);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg2);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;min-height:100vh}

/* ── Header ── */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:56px;background:#ffffff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.hdr-left{display:flex;align-items:center;gap:14px}
.rtoggle{display:flex;gap:2px;background:var(--bg3);border-radius:8px;padding:3px;border:1px solid var(--border)}
.rbtn{padding:4px 14px;border-radius:6px;border:none;background:transparent;color:var(--text2);font-size:12px;font-family:'Inter',sans-serif;font-weight:500;cursor:pointer;transition:all .15s;line-height:1.2}
.rbtn.on{background:var(--bg);color:var(--text);box-shadow:var(--shadow);font-weight:600}
.rbtn:hover:not(.on){background:rgba(41,151,100,.08);color:var(--green-d)}

/* ── Vertical selector ── */
.vsec{padding:20px 24px 0;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.vcard{background:var(--bg);border:1.5px solid var(--border);border-radius:12px;padding:16px 18px;cursor:pointer;transition:all .2s}
.vcard:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.vcard[data-v="lending"]:hover,.vcard.on[data-v="lending"]{border-color:var(--green);background:var(--green-l)}
.vcard[data-v="trading"]:hover,.vcard.on[data-v="trading"]{border-color:var(--purple);background:var(--purple-l)}
.vcard[data-v="remittance"]:hover,.vcard.on[data-v="remittance"]{border-color:var(--blue);background:var(--blue-l)}
.vcard[data-v="lending"]:hover .vcard-num,.vcard[data-v="lending"]:hover .vcard-lbl,.vcard.on[data-v="lending"] .vcard-num,.vcard.on[data-v="lending"] .vcard-lbl{color:var(--green-d)}
.vcard[data-v="trading"]:hover .vcard-num,.vcard[data-v="trading"]:hover .vcard-lbl,.vcard.on[data-v="trading"] .vcard-num,.vcard.on[data-v="trading"] .vcard-lbl{color:var(--purple)}
.vcard[data-v="remittance"]:hover .vcard-num,.vcard[data-v="remittance"]:hover .vcard-lbl,.vcard.on[data-v="remittance"] .vcard-num,.vcard.on[data-v="remittance"] .vcard-lbl{color:var(--blue)}
.vcard-num{font-weight:700;font-size:10px;letter-spacing:.08em;margin-bottom:8px;color:var(--text3);transition:color .2s}
.vcard-lbl{font-weight:700;font-size:14px;color:var(--text);margin-bottom:3px;transition:color .2s}
.vcard-sub{font-size:11px;color:var(--text3);line-height:1.4}

/* ── View toggle row ── */
.viewrow{padding:14px 24px 0;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.viewrow-legend{font-size:11px;color:var(--text3)}
.viewrow-legend .lg-na{color:var(--coral);font-weight:600;text-decoration:line-through}
.viewrow-legend .lg-ok{color:var(--text2);font-weight:600}

/* ── Main grid ── */
.wrap{display:grid;grid-template-columns:280px 1fr;height:calc(100vh - 230px);min-height:420px;margin-top:14px}
.sb{background:var(--bg);border:1px solid var(--border);border-right:none;border-radius:12px 0 0 12px;overflow-y:auto;margin-left:24px}
.sb::-webkit-scrollbar{width:3px}
.sb::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.sb-hdr{padding:11px 14px 9px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--bg2);position:sticky;top:0;z-index:5}
.sb-title{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text3)}
.sb-count{font-size:11px;color:var(--text3);font-family:'JetBrains Mono',monospace}
.sb-group{padding:8px 14px 4px;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);background:var(--bg);border-bottom:1px solid var(--border)}
.ibt{width:100%;text-align:left;padding:9px 14px;border:none;background:transparent;color:var(--text);font-size:12px;font-family:'Inter',sans-serif;cursor:pointer;transition:all .12s;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:9px}
.ibt:hover{background:var(--hl-l)}
.ibt:hover .ibt-name{color:var(--hl-d)}
.ibt.on{background:var(--hl-l);border-left:3px solid var(--hl);padding-left:11px}
.idot{width:6px;height:6px;border-radius:50%;flex-shrink:0;transition:background .12s;background:var(--hl)}
.ibt-name{flex:1;font-size:12px;line-height:1.35;transition:color .12s}
.ibadge{font-size:9px;padding:2px 7px;border-radius:6px;font-weight:500;flex-shrink:0;letter-spacing:.02em;font-family:'JetBrains Mono',monospace}

/* ── Detail panel ── */
.det{background:var(--bg);border:1px solid var(--border);border-radius:0 12px 12px 0;overflow-y:auto;padding:24px 28px;margin-right:24px}
.det::-webkit-scrollbar{width:3px}
.det::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.empty-st{display:flex;flex-direction:column;align-items:center;justify-content:center;height:72%;color:var(--text3);gap:14px;text-align:center}
.empty-ico{width:44px;height:44px;border-radius:10px;background:var(--green-l);display:flex;align-items:center;justify-content:center}
.det-eyebrow{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px}
.det-name{font-weight:700;font-size:21px;letter-spacing:-.02em;color:var(--text);margin-bottom:6px;line-height:1.2}
.det-desc{font-size:13px;color:var(--text2);line-height:1.65;margin-bottom:14px;max-width:620px}
.metarow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.mbadge{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:500;border:1px solid transparent}
.tab-bar{display:flex;border-bottom:2px solid var(--border);margin-bottom:20px}
.tab-btn{padding:8px 16px;border:none;background:transparent;font-size:12px;font-weight:500;font-family:'Inter',sans-serif;cursor:pointer;color:var(--text3);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .12s}
.tab-btn:hover{color:var(--hl-d)}
.tab-btn.on{color:var(--hl-d);border-bottom-color:var(--hl)}

/* ── Category sections & use case cards ── */
.chain{display:flex;flex-direction:column;gap:14px}
.csec{border:1px solid var(--border);border-radius:10px;overflow:hidden}
.chdr{padding:10px 14px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.chlbl{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.chcnt{font-size:11px;color:var(--text3);margin-left:auto}
.citems{padding:12px;display:flex;flex-wrap:wrap;gap:7px;background:var(--bg)}
.uclist{display:flex;flex-direction:column}
.uc-card{padding:14px;border-bottom:1px solid var(--border);background:var(--bg)}
.uc-card:last-child{border-bottom:none}
.uc-top{display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap}
.uc-name{font-size:13px;font-weight:600;color:var(--text);cursor:pointer}
.uc-name:hover{color:var(--hl-d);text-decoration:underline}
.uc-desc{font-size:12px;color:var(--text2);line-height:1.6;margin-bottom:10px;max-width:640px}
.pgrid{display:flex;flex-direction:column;gap:6px}
.prow{display:flex;gap:8px;align-items:flex-start}
.pfam{flex-shrink:0;width:92px;font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);padding-top:6px}
.pchips{display:flex;flex-wrap:wrap;gap:5px}
.pchip{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:8px;font-size:11px;font-weight:500;border:1px solid var(--border);background:var(--bg2);color:var(--text);cursor:pointer;transition:all .13s}
.pchip:hover{border-color:var(--hl);background:var(--hl-l);color:var(--hl-d)}
.rg{font-size:8px;font-weight:700;letter-spacing:.04em;padding:1.5px 5px;border-radius:4px;font-family:'JetBrains Mono',monospace}
.rg-uae{background:var(--blue-l);color:var(--blue)}
.rg-ksa{background:var(--amber-l);color:var(--amber)}
.rg-na{background:var(--coral-l);color:var(--coral);text-decoration:line-through}
.ctag{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:8px;font-size:12px;cursor:pointer;font-weight:500;transition:all .13s;border:1px solid transparent}
.ctag:hover{filter:brightness(.93);transform:translateY(-1px);box-shadow:var(--shadow-md)}
.ctag-dep{font-size:9px;font-weight:600;opacity:.65;letter-spacing:.03em}
.nores{color:var(--text3);font-size:12px;padding:4px 0}

/* ── Matrix ── */
.mx-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px}
.mx{border-collapse:collapse;font-size:11px;white-space:nowrap;width:100%}
.mx thead th{padding:9px 8px;text-align:center;font-size:9px;font-weight:600;letter-spacing:.03em;color:var(--text3);border-bottom:2px solid var(--border);background:var(--bg2);text-transform:uppercase;user-select:none;max-width:110px;white-space:normal;vertical-align:bottom;line-height:1.3}
.mx thead th.rh{text-align:left;position:sticky;left:0;background:var(--bg2);z-index:2;min-width:170px}
.mx tbody td{padding:6px 8px;text-align:center;border-bottom:1px solid var(--border)}
.mx tbody td.rh{text-align:left;position:sticky;left:0;background:var(--bg);font-size:12px;font-weight:500;padding:7px 14px;z-index:1;border-right:1px solid var(--border);white-space:normal;min-width:170px}
.mx tbody tr:last-child td{border-bottom:none}
.mx tbody tr:hover td{background:var(--hl-l)}
.mx tbody tr:hover td.rh{background:var(--hl-l);color:var(--hl-d)}
.mh{background:var(--green-l);color:var(--green-d);border-radius:4px;padding:2px 6px;font-weight:600;font-size:9px;font-family:'JetBrains Mono',monospace}
.mna{background:var(--coral-l);color:var(--coral);border-radius:4px;padding:2px 6px;font-weight:600;font-size:9px;font-family:'JetBrains Mono',monospace;text-decoration:line-through}
.me{color:var(--border2)}

/* ── Colour helpers ── */
.c-green{color:var(--green-d)}.c-purple{color:var(--purple)}.c-coral{color:var(--coral)}.c-blue{color:var(--blue)}.c-amber{color:var(--amber)}
.bg-green{background:var(--green-l);border-color:var(--green-b);color:var(--green-d)}
.bg-purple{background:var(--purple-l);border-color:var(--purple-b);color:var(--purple)}
.bg-coral{background:var(--coral-l);border-color:var(--coral-b);color:var(--coral)}
.bg-blue{background:var(--blue-l);border-color:var(--blue-b);color:var(--blue)}
.bg-amber{background:var(--amber-l);border-color:rgba(217,119,6,.2);color:var(--amber)}
.bg-gray{background:var(--bg3);border-color:var(--border2);color:var(--text2)}
.t-green{color:var(--green-d)}.t-purple{color:var(--purple)}.t-coral{color:var(--coral)}.t-blue{color:var(--blue)}.t-amber{color:var(--amber)}

@media(max-width:768px){
  .vsec{grid-template-columns:1fr}
  .wrap{grid-template-columns:1fr;height:auto}
  .sb{margin-left:12px;max-height:260px;border-radius:12px 12px 0 0;border-right:1px solid var(--border);border-bottom:none}
  .det{margin-right:12px;border-top:none;border-radius:0 0 12px 12px;margin-left:12px}
}
</style>
</head>

ank","v":"lending","name":"Traditional Bank","desc":"A brick and mortar bank that provides loans.","ex":"SNB"},{"id":"le_digital_bank","v":"lending","name":"Digital Bank","desc":"Online bank that provides loans through digital channels without relying on traditional networks.","ex":"STC Bank"},{"id":"le_loan_aggregator","v":"lending","name":"Loan Aggregator","desc":"Marketplace to compare and apply for loan products across multiple lenders","ex":"Tameeni"},{"id":"le_insurance_broker","v":"lending","name":"Insurance Broker","desc":"Intermediary that sells and advises on policies from multiple insurers on behalf of the customer (individuals or businesses).","ex":"(Al Mamoon)"},{"id":"le_insurance_provider","v":"lending","name":"Insurance Provider","desc":"Financial institution that provides insurance policies to individuals and businesses. They are the one underwriting the insurance policies.","ex":"Tawuniya"},{"id":"le_insurance_aggregator","v":"lending","name":"Insurance Aggregator","desc":"Marketplace to compare and purchase insurance policies across multiple providers","ex":"Tameeni"},{"id":"le_tpas","v":"lending","name":"TPAs","desc":"provides administrative services on behalf of an insurance company. TPAs do not underwrite insurance policies or assume financial risk; that manages claims processing and policy servicing on behalf of insurers","ex":"GlobeMed"},{"id":"tr_trading_brokerages_cfds_with_leverage","v":"trading","name":"Trading, Brokerages & CFDs (with leverage)","desc":"Actively trading stocks and assets WITH leverage options. High-risk/high-reward, with margin requirements and stricter regulatory scrutiny.","ex":"Capital.com"},{"id":"tr_trading_brokerages_cfds_without_leverage","v":"trading","name":"Trading, Brokerages & CFDs (without leverage)","desc":"Buying and selling stocks and assets WITHOUT leverage. Lower regulatory complexity than CFDs but same core payment and verification needs.","ex":"Baraka"},{"id":"tr_gold_trading","v":"trading","name":"Gold Trading","desc":"Buy, sell, and hold gold, physically backed or digital. Often used as a savings vehicle in the UAE.","ex":"O Gold"},{"id":"tr_robo_advisory_wealth_management","v":"trading","name":"Robo Advisory & Wealth Management","desc":"Manages investments on behalf of the customer based on their risk appetite. Customers deposit, and the platform invests for them, no active trading required.","ex":"Sarwa"},{"id":"tr_crypto","v":"trading","name":"Crypto","desc":"Crypto buying, selling, and trading. Must comply with VARA and CBUAE rules; identity, address, and source-of-funds checks are mandatory.","ex":"Binance"},{"id":"tr_crowdfunding","v":"trading","name":"Crowdfunding","desc":"Connecting investors to early-stage businesses, allowing crowd-sourced SME financing. Has two customer types: investors (pay in) and SMEs (receive funds).","ex":"Beehive"},{"id":"tr_payment_aggregator","v":"trading","name":"Payment Aggregator","desc":"A licensed entity (PI licensed) that settles payments on behalf of merchants, they hold and disburse the money, unlike a bank or a pure tech provider.","ex":"Checkout.com"},{"id":"tr_ptdp","v":"trading","name":"PTDP","desc":"A technical payment provider that processes and routes transactions but relies on banks for settlement. Does not hold money; limited Lean touchpoints.","ex":"Network International"},{"id":"tr_payment_orchestrator","v":"trading","name":"Payment Orchestrator","desc":"An intermediary that connects businesses to multiple payment providers through one integration, routing transactions to the best available channel.","ex":"Praxis"},{"id":"tr_pos_provider","v":"trading","name":"POS Provider","desc":"Supplies physical point-of-sale terminals to merchants for in-store card and digital payments.","ex":"Network International"},{"id":"tr_igaming","v":"trading","name":"iGaming","desc":"Online gaming, lottery, and betting platforms that handle wallet top-ups, ticket purchases, and winnings payouts. Regulated in the UAE; a licence 1}}],"subs":["re_domestic_exchange_house","re_domestic_digital_remittance_platform"]},{"id":"re_international_corridor_settlement","v":"remittance","name":"International corridor settlement","cat":"Payments","prio":null,"desc":"Settle the cross-border leg faster between the remittance provider, banking partners and destination market.","prods":[{"n":"Operational Settlement - Standard - FX Premium","g":"SwiftX","rg":{"UAE":1}},{"n":"Currency Exchange - Standard - FX Premium","g":"SwiftX","rg":{"UAE":1}}],"subs":["re_digital_wallet_open_loop","re_international_remittance_platforms"]},{"id":"re_fiat_withdrawal","v":"remittance","name":"Fiat Withdrawal","cat":"Payments","prio":null,"desc":"Converting cryptocurrency (USDT, USDC) to local fiat currency (AED, USD, PKR) and transferring to a verified personal or business bank account.","prods":[{"n":"Operational Settlement - Standard - FX Premium","g":"SwiftX","rg":{"UAE":1}},{"n":"Currency Exchange - Standard - FX Premium","g":"SwiftX","rg":{"UAE":1}}],"subs":[]},{"id":"re_recurring_remittances_scheduled_transfers","v":"remittance","name":"Recurring remittances / scheduled transfers","cat":"Payments","prio":null,"desc":"Supports repeat money transfers by using linked-account data and payment schedules to reduce friction for customers who send on a regular cycle.","prods":[{"n":"Retail Payment Initiation: Remittance & Sweeping","g":"Pay-ins","rg":{"UAE":1}},{"n":"International AVS: Group 5 - KSA AVS Freelancer","g":"Verification","rg":{"UAE":1}},{"n":"International AVS: Group 5 - KSA AVS+ Freelancer","g":"Verification","rg":{"UAE":1}}],"subs":[]},{"id":"re_payment_reconciliation","v":"remittance","name":"Payment Reconciliation","cat":"Reconciliation","prio":null,"desc":"Matches incoming pay-ins, transfer instructions, FX events and outbound payouts so operations teams can close breaks faster and maintain a clear audit trail.","prods":[{"n":"Reconciliation","g":"Pay-ins","rg":{"UAE":1}},{"n":"Essential Data: Retail","g":"Data","rg":{"KSA":1}},{"n":"Silver Data: Retail","g":"Data","rg":{"KSA":1}},{"n":"Essential Data: Corporate","g":"Data","rg":{"KSA":1}},{"n":"Silver Data: Corporate","g":"Data","rg":{"KSA":1}}],"subs":["re_domestic_exchange_house","re_domestic_digital_remittance_platform","re_digital_wallet_open_loop","re_international_remittance_platforms"]}]};

/* ── indexes ── */
const VCOLOR={lending:"green",trading:"purple",remittance:"blue"};
const VDARK={green:"var(--green-d)",purple:"var(--purple)",blue:"var(--blue)"};
const VMAIN={green:"var(--green)",purple:"var(--purple)",blue:"var(--blue)"};
const VLIGHT={green:"var(--green-l)",purple:"var(--purple-l)",blue:"var(--blue-l)"};
const CATCOLORS=["green","coral","purple","amber","blue"];
const FAMORDER=["Pay-ins","Pay-ins (New)","Payouts","Data","Verification","SwiftX"];

const subById={},ucById={};
DB.subs.forEach(s=>subById[s.id]=s);
DB.ucs.forEach(u=>ucById[u.id]=u);

const catColor={}; // vertical -> cat -> color
DB.verticals.forEach(v=>{
  const cats=[...new Set(DB.ucs.filter(u=>u.v===v.id).map(u=>u.cat))];
  catColor[v.id]={};
  cats.forEach((c,i)=>catColor[v.id][c]=CATCOLORS[i%CATCOLORS.length]);
});

// unique products per vertical
const prodsByV={};
DB.verticals.forEach(v=>{
  const m={};
  DB.ucs.filter(u=>u.v===v.id).forEach(u=>u.prods.forEach(p=>{
    const k=p.g+"|"+p.n;
    const e=m[k]||(m[k]={key:k,n:p.n,g:p.g,rg:{}});
    Object.entries(p.rg).forEach(([r,st])=>{e.rg[r]=Math.max(e.rg[r]||0,st)});
  }));
  prodsByV[v.id]=Object.values(m).sort((a,b)=>FAMORDER.indexOf(a.g)-FAMORDER.indexOf(b.g)||a.n.localeCompare(b.n));
});

/* ── state ── */
let V="lending",VIEW="industry",R="Both",I=null,T="chain";

const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const col=()=>VCOLOR[V];
function setHl(el){const c=col();el.style.setProperty("--hl",VMAIN[c]);el.style.setProperty("--hl-l",VLIGHT[c]);el.style.setProperty("--hl-d",VDARK[c]);}

/* region helpers */
const rgVisible=p=>R==="Both"?Object.keys(p.rg).length>0:p.rg[R]!=null;
function rgTags(p){
  return ["UAE","KSA"].filter(r=>p.rg[r]&&(R==="Both"||R===r))
    .map(r=>`<span class="rg ${p.rg[r]===2?"rg-na":(r==="UAE"?"rg-uae":"rg-ksa")}" title="${p.rg[r]===2?"Not currently available in "+r:"Applies in "+r}">${r}</span>`).join("");
}

/* ── vertical cards ── */
function rVsec(){
  document.getElementById("vsec").innerHTML=DB.verticals.map((v,i)=>{
    const ucN=DB.ucs.filter(u=>u.v===v.id).length,subN=DB.subs.filter(s=>s.v===v.id).length;
    return`<div class="vcard ${V===v.id?"on":""}" data-v="${v.id}" data-act="vert">
      <div class="vcard-num">0${i+1} — ${subN} SUB-INDUSTRIES · ${ucN} USE CASES</div>
      <div class="vcard-lbl">${esc(v.name)}</div>
      <div class="vcard-sub">${esc(v.sub)}</div></div>`;
  }).join("");
}

/* ── sidebar ── */
function rSB(){
  const sb=document.getElementById("sb");setHl(sb);
  let html="";
  if(VIEW==="industry"){
    const items=DB.subs.filter(s=>s.v===V);
    html=`<div class="sb-hdr"><span class="sb-title">Sub-Industries</span><span class="sb-count">${items.length}</span></div>`;
    html+=items.map(s=>{
      const n=DB.ucs.filter(u=>u.subs.includes(s.id)).length;
      return`<button class="ibt ${I===s.id?"on":""}" data-act="sel" data-id="${s.id}">
        <span class="idot"></span><span class="ibt-name">${esc(s.name)}</span>
        <span class="ibadge ${n?"bg-gray":"bg-coral"}">${n} UC${n===1?"":"s"}</span></button>`;
    }).join("");
  }else if(VIEW==="usecase"){
    const items=DB.ucs.filter(u=>u.v===V);
    html=`<div class="sb-hdr"><span class="sb-title">Use Cases</span><span class="sb-count">${items.length}</span></div>`;
    let lastCat=null;
    items.forEach(u=>{
      if(u.cat!==lastCat){html+=`<div class="sb-group t-${catColor[V][u.cat]}">${esc(u.cat)}</div>`;lastCat=u.cat;}
      html+=`<button class="ibt ${I===u.id?"on":""}" data-act="sel" data-id="${u.id}">
        <span class="idot"></span><span class="ibt-name">${esc(u.name)}</span>
        ${u.prio?`<span class="ibadge ${u.prio==="Primary"?"bg-green":"bg-amber"}">${u.prio}</span>`:""}</button>`;
    });
  }else{
    const items=prodsByV[V].filter(rgVisible);
    html=`<div class="sb-hdr"><span class="sb-title">Products</span><span class="sb-count">${items.length}</span></div>`;
    let lastG=null;
    items.forEach(p=>{
      if(p.g!==lastG){html+=`<div class="sb-group">${esc(p.g)}</div>`;lastG=p.g;}
      html+=`<button class="ibt ${I===p.key?"on":""}" data-act="sel" data-id="${esc(p.key)}">
        <span class="idot"></span><span class="ibt-name">${esc(p.n)}</span>${rgTags(p)}</button>`;
    });
    if(!items.length)html+=`<div class="nores" style="padding:16px">No products for this region</div>`;
  }
  sb.innerHTML=html;
}

/* ── product chips grouped by family ── */
function prodGrid(prods){
  const vis=prods.filter(rgVisible);
  if(!vis.length)return`<div class="nores">No mapped products${R!=="Both"?" for "+R:""}</div>`;
  const fams=FAMORDER.filter(f=>vis.some(p=>p.g===f));
  return`<div class="pgrid">${fams.map(f=>`
    <div class="prow"><div class="pfam">${esc(f)}</div><div class="pchips">${
      vis.filter(p=>p.g===f).map(p=>`<span class="pchip" data-act="prod" data-id="${esc(p.g+"|"+p.n)}" title="View product">${esc(p.n)}${rgTags(p)}</span>`).join("")
    }</div></div>`).join("")}</div>`;
}

/* ── detail ── */
function rDet(){
  const d=document.getElementById("det");setHl(d);
  if(!I){
    d.innerHTML=`<div class="empty-st"><div class="empty-ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#00a376" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></div>
    <p style="font-size:13px;max-width:260px;line-height:1.6">Pick a ${VIEW==="industry"?"sub-industry":VIEW==="usecase"?"use case":"product"} from the left to see its full mapping</p></div>`;return;
  }
  if(VIEW==="industry")rDetSub(d);
  else if(VIEW==="usecase")rDetUC(d);
  else rDetProd(d);
}

function rDetSub(d){
  const s=subById[I];if(!s){d.innerHTML="";return}
  const vert=DB.verticals.find(v=>v.id===V);
  const ucs=DB.ucs.filter(u=>u.subs.includes(s.id));
  const prodSet={};ucs.forEach(u=>u.prods.filter(rgVisible).forEach(p=>prodSet[p.g+"|"+p.n]=1));
  const tabs=`<div class="tab-bar"><button class="tab-btn ${T==="chain"?"on":""}" data-act="tab" data-id="chain">Use cases &amp; products</button><button class="tab-btn ${T==="matrix"?"on":""}" data-act="tab" data-id="matrix">Matrix</button></div>`;
  let body="";
  if(!ucs.length){
    body=`<div class="nores">No use cases mapped to this sub-industry yet.</div>`;
  }else if(T==="chain"){
    const cats=[...new Set(ucs.map(u=>u.cat))];
    body=`<div class="chain">${cats.map(c=>{
      const list=ucs.filter(u=>u.cat===c);
      return`<div class="csec"><div class="chdr"><span class="chlbl t-${catColor[V][c]}">${esc(c)}</span><span class="chcnt">${list.length} use case${list.length!==1?"s":""}</span></div>
      <div class="uclist">${list.map(u=>`
        <div class="uc-card"><div class="uc-top">
          <span class="uc-name" data-act="uc" data-id="${u.id}">${esc(u.name)}</span>
          ${u.prio?`<span class="ibadge ${u.prio==="Primary"?"bg-green":"bg-amber"}">${u.prio}</span>`:""}
        </div>
        ${u.desc?`<div class="uc-desc">${esc(u.desc)}</div>`:""}
        ${prodGrid(u.prods)}</div>`).join("")}</div></div>`;
    }).join("")}</div>`;
  }else{
    body=mxSub(s,ucs);
  }
  d.innerHTML=`<div class="det-eyebrow c-${col()}">${esc(vert.name)} · Sub-Industry</div>
    <div class="det-name">${esc(s.name)}</div>
    ${s.desc?`<div class="det-desc">${esc(s.desc)}</div>`:""}
    <div class="metarow">
      ${s.ex?`<span class="mbadge bg-gray">e.g. ${esc(s.ex)}</span>`:""}
      <span class="mbadge bg-${col()}">${ucs.length} use case${ucs.length!==1?"s":""}</span>
      <span class="mbadge bg-gray">${Object.keys(prodSet).length} product${Object.keys(prodSet).length!==1?"s":""}${R!=="Both"?" · "+R:""}</span>
    </div>${tabs}${body}`;
}

function mxSub(s,ucs){
  const pm={};
  ucs.forEach(u=>u.prods.filter(rgVisible).forEach(p=>{pm[p.g+"|"+p.n]=p}));
  const cols=Object.values(pm).sort((a,b)=>FAMORDER.indexOf(a.g)-FAMORDER.indexOf(b.g)||a.n.localeCompare(b.n));
  if(!cols.length)return`<div class="nores">No products to display${R!=="Both"?" for "+R:""}</div>`;
  const th=`<tr><th class="rh">Use case</th>${cols.map(c=>`<th title="${esc(c.g)}">${esc(c.n)}</th>`).join("")}</tr>`;
  const tb=ucs.map(u=>{
    const m={};u.prods.forEach(p=>m[p.g+"|"+p.n]=p);
    return`<tr><td class="rh">${esc(u.name)}</td>${cols.map(c=>{
      const p=m[c.key||c.g+"|"+c.n];
      if(!p||!rgVisible(p))return`<td><span class="me">·</span></td>`;
      const regs=["UAE","KSA"].filter(r=>p.rg[r]&&(R==="Both"||R===r));
      return`<td>${regs.map(r=>`<span class="${p.rg[r]===2?"mna":"mh"}" title="${p.rg[r]===2?"Not currently available in "+r:r}">${r}</span>`).join(" ")}</td>`;
    }).join("")}</tr>`;
  }).join("");
  return`<div class="mx-wrap"><table class="mx"><thead>${th}</thead><tbody>${tb}</tbody></table></div>`;
}

function rDetUC(d){
  const u=ucById[I];if(!u){d.innerHTML="";return}
  const vert=DB.verticals.find(v=>v.id===V);
  const subs=u.subs.map(id=>subById[id]).filter(Boolean);
  d.innerHTML=`<div class="det-eyebrow c-${col()}">${esc(vert.name)} · Use Case</div>
    <div class="det-name">${esc(u.name)}</div>
    ${u.desc?`<div class="det-desc">${esc(u.desc)}</div>`:""}
    <div class="metarow">
      <span class="mbadge bg-${catColor[V][u.cat]}">${esc(u.cat)}</span>
      ${u.prio?`<span class="mbadge ${u.prio==="Primary"?"bg-green":"bg-amber"}">${u.prio}</span>`:""}
    </div>
    <div class="chain">
      <div class="csec"><div class="chdr"><span class="chlbl t-${col()}">Sub-industries with this use case</span><span class="chcnt">${subs.length}</span></div>
        <div class="citems">${subs.length?subs.map(s=>`<span class="ctag bg-${col()}" data-act="sub" data-id="${s.id}">${esc(s.name)}</span>`).join(""):`<span class="nores">Not mapped to any sub-industry yet</span>`}</div></div>
      <div class="csec"><div class="chdr"><span class="chlbl t-purple">Products that deliver this</span></div>
        <div style="padding:12px">${prodGrid(u.prods)}</div></div>
    </div>`;
}

function rDetProd(d){
  const p=prodsByV[V].find(x=>x.key===I);if(!p){d.innerHTML="";return}
  const vert=DB.verticals.find(v=>v.id===V);
  const ucs=DB.ucs.filter(u=>u.v===V&&u.prods.some(x=>x.g===p.g&&x.n===p.n&&rgVisible(x)));
  const subSet={};ucs.forEach(u=>u.subs.forEach(s=>subSet[s]=1));
  const subs=Object.keys(subSet).map(id=>subById[id]).filter(Boolean);
  d.innerHTML=`<div class="det-eyebrow c-${col()}">${esc(vert.name)} · Product</div>
    <div class="det-name">${esc(p.n)}</div>
    <div class="metarow"><span class="mbadge bg-purple">${esc(p.g)}</span>
      ${["UAE","KSA"].filter(r=>p.rg[r]).map(r=>`<span class="mbadge ${p.rg[r]===2?"bg-coral":r==="UAE"?"bg-blue":"bg-amber"}">${r}${p.rg[r]===2?" — not yet available":""}</span>`).join("")}
    </div>
    <div class="chain">
      <div class="csec"><div class="chdr"><span class="chlbl t-coral">Use cases served</span><span class="chcnt">${ucs.length}</span></div>
        <div class="citems">${ucs.length?ucs.map(u=>`<span class="ctag bg-coral" data-act="uc" data-id="${u.id}">${esc(u.name)}<span class="ctag-dep">${esc(u.cat)}</span></span>`).join(""):`<span class="nores">None${R!=="Both"?" for "+R:""}</span>`}</div></div>
      <div class="csec"><div class="chdr"><span class="chlbl t-${col()}">Sub-industries reached</span><span class="chcnt">${subs.length}</span></div>
        <div class="citems">${subs.length?subs.map(s=>`<span class="ctag bg-${col()}" data-act="sub" data-id="${s.id}">${esc(s.name)}</span>`).join(""):`<span class="nores">None</span>`}</div></div>
    </div>`;
}

/* ── events ── */
function render(){rVsec();rSB();rDet();
  document.querySelectorAll("#viewtoggle .rbtn").forEach(b=>b.classList.toggle("on",b.dataset.view===VIEW));
  document.querySelectorAll(".hdr .rbtn").forEach(b=>b.classList.toggle("on",b.dataset.r===R));
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act],[data-r],[data-view]");if(!t)return;
  if(t.dataset.r){R=t.dataset.r;render();return}
  if(t.dataset.view){VIEW=t.dataset.view;I=null;T="chain";render();return}
  const act=t.dataset.act,id=t.dataset.id;
  if(act==="vert"){V=t.dataset.v;I=null;T="chain";render()}
  else if(act==="sel"){I=id;T="chain";rSB();rDet()}
  else if(act==="tab"){T=id;rDet()}
  else if(act==="sub"){VIEW="industry";I=id;T="chain";render()}
  else if(act==="uc"){VIEW="usecase";I=id;render()}
  else if(act==="prod"){VIEW="product";I=id;render()}
});
render();
</script>
</body>
</html>
